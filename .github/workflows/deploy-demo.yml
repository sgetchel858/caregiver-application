# Builds app/ and deploys it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Gives the sub-path the site is served from ("/<repo>", or "" for a
      # user site or custom domain).
      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          # The public demo runs on the mock services. No secrets here:
          # everything in the build is public.
          VITE_HEALTH_API: mock
          VITE_APP_STORE: mock
          # Optional sign-in with the Cognatum account (app/README.md): set the
          # repository VARIABLE VITE_AUTH=auth0. The Auth0 domain, client id and
          # Cognatum URL come from app/.env; don't set them here, an empty value
          # would override that file.
          VITE_AUTH: ${{ vars.VITE_AUTH || 'none' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
